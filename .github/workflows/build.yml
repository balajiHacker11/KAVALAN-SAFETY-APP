name: Build Sentinel AI APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradle-wrapper.properties" \) -print

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Java
        run: java -version

      - name: Check Gradle Wrapper
        run: |
          if [ -f "./gradlew" ]; then
            echo "Gradle Wrapper found"
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle Wrapper NOT found"
            echo "The project needs a Gradle version to be specified."
            exit 1
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: sentinel-ai-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
